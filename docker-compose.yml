name: umkm
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Port dibuka agar web app lokal (npm run dev) bisa terhubung ke database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Skrip 01/02/03 dijalankan otomatis saat volume masih kosong
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Dipakai workflow Schedule (JS-5) untuk memanggil API web app.
      RAPOR_BASE_URL: ${RAPOR_BASE_URL:-http://host.docker.internal:3000}
      N8N_API_KEY: ${N8N_API_KEY:-}
      # Workflow Schedule memakai $env.RAPOR_BASE_URL; akses env harus diizinkan.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Jangan pakai cookie Secure saat diakses http://localhost:5678.
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pg_data:
  n8n_data:
